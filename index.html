<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: dark)">
    <title>Fretboard Visualizer</title>
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/controls.css">
    <link rel="stylesheet" href="static/css/find.css">
    <link rel="stylesheet" href="static/css/games.css">
    <link rel="stylesheet" href="static/css/dev-panel.css">
    <link rel="stylesheet" href="static/css/learning.css?v=1">
    <link rel="stylesheet" href="static/css/settings.css">
    <link rel="stylesheet" href="static/css/control-workspace.css?v=2">
    <link rel="stylesheet" href="static/css/triad-comparison.css">
</head>
<body>
    <div class="app-container">
        <div id="controls-panel">
            <h2>Controls</h2>

            <div class="controls-scroll-area">
            <!-- Mode Section: groups mode toggle with dependent controls -->
            <div class="mode-section">
                <div class="control-workspace">
                <div class="mode-picker">
                    <label for="mode-select">Explore</label>
                    <select id="mode-select">
                        <option value="scale">Scales</option>
                        <option value="chord">Chords</option>
                        <option value="interval">Intervals</option>
                        <option value="caged">CAGED shapes</option>
                        <option value="modes">Modes</option>
                        <option value="prog">Progressions</option>
                        <option value="f.chord">Find chord</option>
                        <option value="f.scale">Find scale</option>
                        <option value="games">Games</option>
                    </select>
                </div>
                <div class="mode-controls">
                    <div id="root-group" class="control-group">
                        <label for="root-note" id="root-label">Root Note</label>
                        <select id="root-note">
                            <option value="C">C</option>
                            <option value="C#">C#</option>
                            <option value="D">D</option>
                            <option value="Eb">Eb</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="F#">F#</option>
                            <option value="G">G</option>
                            <option value="Ab">Ab</option>
                            <option value="A">A</option>
                            <option value="Bb">Bb</option>
                            <option value="B">B</option>
                        </select>
                    </div>

                    <div id="prog-submode" class="control-group" style="display: none;">
                        <div class="radio-group">
                            <label class="radio-label checked">
                                <input type="radio" name="prog-submode" value="play" checked> Play
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="prog-submode" value="create"> Create
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="prog-submode" value="edit"> Edit
                            </label>
                        </div>
                    </div>

                    <div id="type-group" class="control-group">
                        <label for="type-select" id="type-label">Scale Type</label>
                        <select id="type-select">
                            <!-- Options populated by JavaScript based on mode -->
                        </select>
                    </div>

                    <div id="chord-key" class="control-group" hidden>
                        <label for="chord-reference-key">Reference key</label>
                        <select id="chord-reference-key"><option value="">Not set</option></select>
                    </div>
                    <button id="compare-chords" class="btn" type="button" hidden>Compare chords</button>
                    <div id="triad-shapes" class="control-group" style="display: none;"></div>

                    <div id="prog-nav" class="prog-nav" style="display: none;">
                        <button id="prog-prev" class="prog-nav-btn">&#9650;</button>
                        <button id="prog-next" class="prog-nav-btn">&#9660;</button>
                        <button id="prog-fav" class="prog-nav-btn prog-fav-btn">&#9825;</button>
                    </div>

                    <div id="caged-shape-selector" class="control-group" style="display: none;">
                        <label>Shape</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="caged-shape" value="all" checked>
                                All
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="caged-shape" value="C">
                                C
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="caged-shape" value="A">
                                A
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="caged-shape" value="G">
                                G
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="caged-shape" value="E">
                                E
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="caged-shape" value="D">
                                D
                            </label>
                        </div>
                    </div>

                    <div id="interval-filter" class="control-group" style="display: none;">
                        <label>Intervals</label>
                        <div class="interval-filter-actions">
                            <button id="interval-select-all" class="btn btn-sm">All</button>
                            <button id="interval-deselect-all" class="btn btn-sm">None</button>
                        </div>
                        <div class="interval-checkboxes">
                            <label class="interval-check" data-interval="1">
                                <input type="checkbox" checked> <span>1</span>
                            </label>
                            <label class="interval-check" data-interval="b2">
                                <input type="checkbox" checked> <span>b2</span>
                            </label>
                            <label class="interval-check" data-interval="2">
                                <input type="checkbox" checked> <span>2</span>
                            </label>
                            <label class="interval-check" data-interval="b3">
                                <input type="checkbox" checked> <span>b3</span>
                            </label>
                            <label class="interval-check" data-interval="3">
                                <input type="checkbox" checked> <span>3</span>
                            </label>
                            <label class="interval-check" data-interval="4">
                                <input type="checkbox" checked> <span>4</span>
                            </label>
                            <label class="interval-check" data-interval="b5">
                                <input type="checkbox" checked> <span>b5</span>
                            </label>
                            <label class="interval-check" data-interval="5">
                                <input type="checkbox" checked> <span>5</span>
                            </label>
                            <label class="interval-check" data-interval="b6">
                                <input type="checkbox" checked> <span>b6</span>
                            </label>
                            <label class="interval-check" data-interval="6">
                                <input type="checkbox" checked> <span>6</span>
                            </label>
                            <label class="interval-check" data-interval="b7">
                                <input type="checkbox" checked> <span>b7</span>
                            </label>
                            <label class="interval-check" data-interval="7">
                                <input type="checkbox" checked> <span>7</span>
                            </label>
                        </div>
                    </div>

                    <div id="scale-chord-builder" class="control-group">
                        <label>Scale Chords</label>
                        <div class="toggle-row">
                            <label class="toggle-label">
                                <input type="checkbox" id="sevenths-toggle">
                                <span class="toggle-text">7ths</span>
                            </label>
                            <label class="toggle-label">
                                <input type="checkbox" id="relative-toggle">
                                <span class="toggle-text">rel</span>
                            </label>
                            <label class="toggle-label">
                                <input type="checkbox" id="chord-intervals-toggle">
                                <span class="toggle-text">scale</span>
                            </label>
                        </div>
                        <div id="scale-chords">
                            <!-- Scale chord buttons populated by JavaScript -->
                        </div>
                        <button id="add-chord-btn" class="btn btn-add" style="display:none;">Add to Chord List</button>
                        <button id="add-prog-btn" class="btn btn-add" style="display:none;">Add Prog to Chord List</button>
                    </div>

                    <div id="find-controls" class="control-group" style="display: none;">
                        <label>Matching Chords</label>
                        <ul id="find-results-list" class="find-results-list"></ul>
                        <div class="find-actions">
                            <button id="find-add-btn" class="btn btn-add" disabled>+ Add</button>
                            <button id="find-clear-btn" class="btn btn-clear">Clear</button>
                        </div>
                    </div>

                    <div id="prog-edit-selector" class="control-group" style="display: none;">
                        <label for="prog-edit-select">Choose Progression</label>
                        <select id="prog-edit-select"></select>
                    </div>

                    <div id="prog-builder" class="control-group" style="display: none;">
                        <label>Build Progression</label>
                        <div id="prog-builder-rows"></div>
                        <div class="prog-builder-actions">
                            <button id="prog-builder-add-row" class="btn btn-sm">+</button>
                        </div>
                        <div class="prog-builder-actions">
                            <button id="prog-builder-from-list" class="btn btn-sm">Populate from Chord List</button>
                        </div>
                    </div>

                    <div id="prog-builder-desc-group" class="control-group" style="display: none;">
                        <label for="prog-builder-description">Description</label>
                        <input type="text" id="prog-builder-description" placeholder="Describe this progression..." maxlength="200">
                        <div class="prog-builder-save-actions">
                            <button id="prog-builder-save" class="btn btn-add">Save</button>
                            <button id="prog-builder-delete" class="btn btn-clear" style="display: none;">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            </div>

            <div class="control-group">
                <label class="chord-list-header">
                    Chord List
                    <span class="toggle-label" id="sound-toggle-label">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="toggle-text">Sound</span>
                    </span>
                </label>
                <ul id="chord-list-items" class="chord-list">
                    <!-- Chord list items populated by JavaScript -->
                </ul>
                <div class="chord-list-actions">
                    <button id="clear-list-btn" class="btn btn-clear">Clear</button>
                </div>
            </div>
            </div>

            <div id="info-panel" class="control-group">
                <div class="info-content">
                    <div id="info-title" class="info-title">C Major</div>
                    <div id="info-grid" class="info-grid"></div>
                </div>
                <div id="chromatic-circle" class="chromatic-circle">
                    <svg id="chromatic-circle-svg" viewBox="0 0 200 200"></svg>
                </div>
            </div>
        </div>

        <div id="fretboard-panel">
            <!-- SVG fretboard will be rendered here by JavaScript -->
        </div>
    </div>

    <div id="games-panel" style="display: none;">
        <button id="games-back-btn" class="games-back-btn">&larr; Back</button>
        <div id="games-controls" class="games-controls">
            <select id="games-select">
                <option value="interval-training">Interval Training</option>
                <option value="blind-interval-training">Blind Interval Training</option>
                <option value="ear-training">Ear Training</option>
                <option value="chromatic-circle-drills">Chromatic Circle Drills</option>
                <option value="fretboard-drills">Fretboard Drills</option>
                <optgroup label="Matrix Drills">
                    <option value="interval-id">Interval ID</option>
                    <option value="note-id">Note ID</option>
                    <option value="interval-locator">Interval Locator</option>
                    <option value="note-locator">Note Locator</option>
                </optgroup>
            </select>
            <button id="games-menu-btn">Menu</button>
            <button id="games-sound-btn" class="games-sound-on">Sound</button>
        </div>
        <div id="game-content" class="game-content"></div>
        <div id="game-settings-modal" class="game-settings-modal">
            <div class="game-settings-box">
                <div class="game-settings-header">
                    <h3 id="game-settings-title">Settings</h3>
                    <button id="game-settings-close" class="game-settings-close">&times;</button>
                </div>
                <div id="game-settings-body" class="game-settings-body"></div>
            </div>
        </div>
    </div>

    <dialog id="triad-comparison" aria-labelledby="comparison-title">
        <header class="comparison-header"><button id="comparison-back" type="button" class="btn">← Back</button><h2 id="comparison-title">Compare chords</h2><span id="comparison-count"></span></header>
        <div id="comparison-boards"></div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/tone/build/Tone.js"></script>
    <script type="module" src="static/js/main.js"></script>
    <button class="app-settings-button" type="button" popovertarget="app-settings" aria-label="Settings" title="Settings"><svg class="settings-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3 1-2h4l1 2 .5 2 2 .9 2-.4 2 3.5-1.5 1.5v2l1.5 1.5-2 3.5-2-.4-2 .9-.5 2-1 2h-4l-1-2-.5-2-2-.9-2 .4-2-3.5L4 13v-2L2.5 9.5l2-3.5 2 .4 2-.9Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <div id="app-settings" popover aria-labelledby="app-settings-title">
        <div class="settings-heading">
            <strong id="app-settings-title">Settings</strong>
            <button type="button" popovertarget="app-settings" popovertargetaction="hide" aria-label="Close settings">&times;</button>
        </div>
        <p class="settings-label">Instrument</p>
        <div class="radio-group instrument-toggle" aria-label="Fretboard instrument">
            <label class="radio-label checked"><input type="radio" name="instrument" value="guitar" checked>Guitar</label>
            <label class="radio-label"><input type="radio" name="instrument" value="bass">Bass</label>
        </div>
        <label class="settings-note-label" id="notenames-toggle-label">
            <input type="checkbox" id="notenames-toggle"> Show note names
        </label>
        <p class="settings-hint">Off shows intervals (1, 3, 5).</p>
    </div>
</body>
</html>
